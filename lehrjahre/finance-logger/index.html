<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeScript Tutorial</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="curator-bar" style="background:#101418;color:#9aa4ae;font:13px/1.6 ui-monospace,monospace;padding:.45rem 1rem;border-bottom:1px solid #2c3640;"><a href="../../lehrjahre.html" style="color:#ffb454;text-decoration:none;">← The Lehrjahre wing</a> · Finance_Logger (2023) — frozen capture; nothing here is live.</div>
    <div >
      <h1 class="main_titel">Finance Logger</h1>
      <div class="wrapper">
        <footer>
          <form class="new-item-form">
            <div class="field">
              <label>Type:</label>
              <select id="type">
                <option value="invoice">Invoice</option>
                <option value="payment">Payment</option>
              </select>
            </div>
            <div class="field">
              <label>To / From:</label>
              <input type="text" id="tofrom" />
            </div>
            <div class="field">
              <label>Details:</label>
              <input type="text" id="details" />
            </div>
            <div class="field">
              <label>Amount (EUR):</label>
              <input type="number" id="amount" />
            </div>
            <button>Add</button>
          </form>
        </footer>
          <!-- output list -->
        <ul class="item-list"></ul>
      </div>
    </div>

    

    <script type="module" src="app.js"></script>
  </body>
</html>
